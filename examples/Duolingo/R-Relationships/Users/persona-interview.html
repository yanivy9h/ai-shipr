<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duolingo — Persona Interview Simulator</title>
<style>
  :root {
    --green:       #47a600;
    --green-light: #7ac70b;
    --green-dark:  #2d6a00;
    --blue:        #1cb0f5;
    --blue-dark:   #1254a9;
    --yellow:      #ffc300;
    --orange:      #ff9600;
    --red:         #ff4b4b;
    --dark:        #4b4b4b;
    --white:       #ffffff;
    --bg:          #f5f5f5;
    --border:      #e0e0e0;
    --text:        #3c3c3c;
    --text-light:  #6b7280;
    --text-muted:  #9ca3af;
    --radius:      14px;
    --radius-sm:   8px;

    --maya:   #1cb0f5;
    --alex:   #ff9600;
    --carol:  #47a600;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--green-dark), var(--green), var(--green-light));
    color: var(--white);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  .duo-owl { font-size: 26px; }
  .header-text h1 { font-size: 17px; font-weight: 800; }
  .header-text p  { font-size: 12px; color: rgba(255,255,255,0.7); }
  .api-area {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
  }
  .api-input {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 12px; color: var(--white);
    width: 230px; font-family: monospace;
    outline: none;
  }
  .api-input::placeholder { color: rgba(255,255,255,0.5); }
  .api-input:focus { border-color: var(--yellow); background: rgba(255,255,255,0.2); }
  .api-save-btn {
    background: var(--yellow); color: var(--green-dark);
    border: none; border-radius: var(--radius-sm);
    padding: 7px 14px; font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: opacity 0.2s;
  }
  .api-save-btn:hover { opacity: 0.85; }
  .api-status { font-size: 11px; color: rgba(255,255,255,0.7); }

  /* ── BODY LAYOUT ── */
  .app-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 260px;
    background: var(--white);
    border-right: 1.5px solid var(--border);
    display: flex; flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar-title {
    padding: 16px 18px 10px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }

  .persona-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    border: none; background: none;
    width: 100%; text-align: left;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    font-family: inherit;
  }
  .persona-btn:hover { background: var(--bg); }
  .persona-btn.active { background: #f0fdf4; }
  .persona-btn.active.maya-active  { background: #e8f6fd; }
  .persona-btn.active.alex-active  { background: #fff4e5; }
  .persona-btn.active.carol-active { background: #f0fdf4; }

  .p-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: var(--white);
    flex-shrink: 0;
  }
  .maya-av  { background: var(--maya); }
  .alex-av  { background: var(--alex); }
  .carol-av { background: var(--carol); }

  .p-info { flex: 1; }
  .p-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .p-tag  { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .p-active-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); flex-shrink: 0;
    display: none;
  }
  .persona-btn.active .p-active-dot { display: block; }

  /* PERSONA BIO in sidebar */
  .persona-bio {
    padding: 14px 18px;
    font-size: 12px; color: var(--text-light);
    line-height: 1.55;
    border-bottom: 1px solid var(--border);
    display: none;
  }
  .persona-bio.visible { display: block; }
  .bio-title { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .bio-fact { margin-bottom: 6px; }

  .suggestion-area { padding: 14px 18px; }
  .suggestion-title { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .suggestion-btn {
    display: block; width: 100%;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 10px; margin-bottom: 6px;
    font-size: 12px; color: var(--text-light);
    cursor: pointer; text-align: left; font-family: inherit;
    transition: all 0.15s;
  }
  .suggestion-btn:hover { background: var(--white); color: var(--text); border-color: var(--green); }

  /* ── CHAT AREA ── */
  .chat-area {
    flex: 1;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* Active persona bar */
  .active-bar {
    padding: 12px 22px;
    background: var(--white);
    border-bottom: 1.5px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .active-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 900; color: var(--white);
  }
  .active-name { font-size: 15px; font-weight: 700; }
  .active-sub  { font-size: 12px; color: var(--text-muted); }
  .online-dot  { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-left: auto; }
  .online-label { font-size: 11px; color: var(--green); font-weight: 600; }
  .reset-btn {
    margin-left: 12px;
    background: none; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 5px 12px;
    font-size: 12px; color: var(--text-light);
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; flex-shrink: 0;
    color: var(--white);
  }
  .msg-avatar.interviewer { background: var(--dark); }

  .msg-bubble {
    max-width: 70%;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 14px; line-height: 1.55;
  }
  .msg.persona .msg-bubble {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }
  .msg.user .msg-bubble {
    background: var(--green-dark);
    color: var(--white);
    border-top-right-radius: 4px;
  }

  .msg-time {
    font-size: 10px; color: var(--text-muted);
    margin-top: 4px;
    padding: 0 4px;
  }
  .msg.user .msg-time { text-align: right; }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    color: var(--text-muted);
    gap: 10px;
    padding: 40px;
  }
  .empty-icon { font-size: 48px; }
  .empty-title { font-size: 17px; font-weight: 700; color: var(--text-light); }
  .empty-sub { font-size: 13px; max-width: 340px; line-height: 1.5; }

  /* Typing indicator */
  .typing-indicator {
    display: flex; gap: 10px; align-items: flex-start;
    display: none;
  }
  .typing-indicator.visible { display: flex; }
  .typing-bubble {
    background: var(--white); border: 1.5px solid var(--border);
    border-radius: 14px; border-top-left-radius: 4px;
    padding: 12px 16px;
    display: flex; gap: 5px; align-items: center;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input bar */
  .input-bar {
    padding: 16px 22px;
    background: var(--white);
    border-top: 1.5px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
    flex-shrink: 0;
  }
  .input-wrap { flex: 1; position: relative; }
  .chat-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px; font-family: inherit;
    color: var(--text); resize: none;
    outline: none; line-height: 1.4;
    max-height: 120px; overflow-y: auto;
    transition: border-color 0.2s;
  }
  .chat-input:focus { border-color: var(--green); }
  .chat-input:disabled { background: var(--bg); cursor: not-allowed; }
  .send-btn {
    width: 44px; height: 44px;
    background: var(--green); color: var(--white);
    border: none; border-radius: 12px;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, opacity 0.2s;
  }
  .send-btn:hover { background: var(--green-dark); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Error toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--red); color: var(--white);
    padding: 12px 18px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    display: none; z-index: 999;
    max-width: 340px; line-height: 1.4;
  }
  .toast.visible { display: block; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="duo-owl">🦉</div>
  <div class="header-text">
    <h1>Persona Interview Simulator</h1>
    <p>Speak directly with Duolingo users — powered by AI</p>
  </div>
  <div class="api-area">
    <input type="password" class="api-input" id="apiKeyInput" placeholder="sk-ant-... (Anthropic API key)">
    <button class="api-save-btn" onclick="saveApiKey()">Save</button>
    <span class="api-status" id="apiStatus"></span>
  </div>
</div>

<div class="app-body">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-title">Select a persona</div>

    <!-- Maya -->
    <button class="persona-btn" onclick="selectPersona('maya')" id="btn-maya">
      <div class="p-avatar maya-av">M</div>
      <div class="p-info">
        <div class="p-name">Maya</div>
        <div class="p-tag">The Casual Learner · 28</div>
      </div>
      <div class="p-active-dot"></div>
    </button>

    <!-- Alex -->
    <button class="persona-btn" onclick="selectPersona('alex')" id="btn-alex">
      <div class="p-avatar alex-av">A</div>
      <div class="p-info">
        <div class="p-name">Alex</div>
        <div class="p-tag">The Motivated Returnee · 35</div>
      </div>
      <div class="p-active-dot"></div>
    </button>

    <!-- Carol -->
    <button class="persona-btn" onclick="selectPersona('carol')" id="btn-carol">
      <div class="p-avatar carol-av">C</div>
      <div class="p-info">
        <div class="p-name">Carol</div>
        <div class="p-tag">The Streak Purist · 48</div>
      </div>
      <div class="p-active-dot"></div>
    </button>

    <!-- Bio panel -->
    <div class="persona-bio" id="persona-bio"></div>

    <!-- Suggestions -->
    <div class="suggestion-area" id="suggestion-area" style="display:none">
      <div class="suggestion-title">💡 Suggested questions</div>
      <div id="suggestions"></div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat-area">
    <!-- Active bar -->
    <div class="active-bar" id="active-bar" style="display:none">
      <div class="active-avatar" id="active-avatar"></div>
      <div>
        <div class="active-name" id="active-name"></div>
        <div class="active-sub" id="active-sub"></div>
      </div>
      <div class="online-dot"></div>
      <span class="online-label">Ready to talk</span>
      <button class="reset-btn" onclick="resetChat()">Clear chat</button>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🎙️</div>
        <div class="empty-title">Pick a persona to begin</div>
        <div class="empty-sub">Select Maya, Alex, or Carol from the sidebar, then start asking questions as if you're conducting a user interview.</div>
      </div>
    </div>

    <!-- Typing -->
    <div class="typing-indicator" id="typing">
      <div class="msg-avatar" id="typing-avatar" style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:white;"></div>
      <div class="typing-bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-bar">
      <div class="input-wrap">
        <textarea class="chat-input" id="chatInput" rows="1"
          placeholder="Ask a question… (Enter to send, Shift+Enter for new line)"
          disabled></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── PERSONA DEFINITIONS ─────────────────────────────────────────────────────

const PERSONAS = {
  maya: {
    name: 'Maya',
    label: 'The Casual Learner',
    age: 28,
    color: '#1cb0f5',
    avatarClass: 'maya-av',
    bio: [
      { label: 'Who she is', text: '28-year-old marketing manager in London. Learning Spanish for a trip to Mexico in September.' },
      { label: 'Pattern', text: 'Has quit Duolingo twice before, both times around day 10. Opens app with good intentions, gets interrupted, feels guilt.' },
      { label: 'Churn trigger', text: 'Streak breaking feels final — not worth restarting from zero.' },
    ],
    suggestions: [
      'Can you tell me why you started learning Spanish?',
      'What usually gets in the way of your lessons?',
      'How do you feel when you miss a day?',
      'What would make you more likely to open the app in the evening?',
      'What does a perfect Duolingo session look like for you?',
    ],
    systemPrompt: `You are Maya, a 28-year-old marketing manager living in London. You are participating in a user interview about your experience with Duolingo.

BACKGROUND:
- You are learning Spanish because you have a trip to Mexico booked for September
- You have tried Duolingo twice before and quit both times around day 10
- You open Duolingo with good intentions at 7pm, get interrupted by something (cooking, a call, TV), close it, and by 8pm the reminder feels annoying rather than motivating
- Missing one day often leads to missing two. The streak breaking feels final — not worth restarting from zero.
- You don't think of yourself as "a language person" — anything that makes you feel like you're failing is discouraging

EMOTIONAL PROFILE:
- You want to feel competent and not embarrassed abroad, especially in markets and restaurants
- You are motivated by small, visible wins: green checkmarks, filled progress bars
- You are sensitive to guilt and failure signals
- You prefer a 4-minute session on your commute with no WiFi over a long study session at home

YOUR IDEAL OUTCOME:
- You finish a lesson on the tube home (short, offline)
- You get a notification at exactly 9:15pm — the moment you'd actually open the app
- You don't associate Duolingo with guilt

INTERVIEW BEHAVIOR:
- Speak naturally, like a real person in a research interview — not like a marketing persona
- Use first-person language, be specific and honest
- Mention real-life details: your commute, your work schedule, your trip plans
- If asked about technical features, respond from your lived experience, not product knowledge
- Occasionally hedge or be uncertain, like a real interview subject
- Keep responses conversational — 2 to 5 sentences unless the question requires more
- Do NOT mention that you are a persona or that this is a simulation. Respond as Maya throughout.`
  },

  alex: {
    name: 'Alex',
    label: 'The Motivated Returnee',
    age: 35,
    color: '#ff9600',
    avatarClass: 'alex-av',
    bio: [
      { label: 'Who he is', text: '35-year-old software engineer in Berlin. 3rd attempt at Japanese. Currently 18 days in, on a 14-day streak.' },
      { label: 'Pattern', text: 'Knows the first 2 weeks are easy — he\'s been here before. His fear is the first streak loss during travel.' },
      { label: 'What he needs', text: 'A safety net, not perfection. He has a 250-day Strava run streak and wants the same relationship with Duolingo.' },
    ],
    suggestions: [
      'Why are you learning Japanese — what\'s driving you this time?',
      'You\'ve tried before. What\'s different about this attempt?',
      'What happened the last time you stopped?',
      'How do you feel about the streak mechanic?',
      'What would help you stay on track during a work trip?',
    ],
    systemPrompt: `You are Alex, a 35-year-old software engineer living in Berlin. You are participating in a user interview about your experience with Duolingo.

BACKGROUND:
- This is your third attempt at learning Japanese
- Your previous two attempts failed at the Kanji wall — the complexity felt overwhelming
- You have been using Duolingo for 18 days and are currently on a 14-day streak
- You take this more seriously than your previous attempts
- You travel for work 2–3 times per year, and travel is your highest churn risk — last time, a work trip to Amsterdam killed your streak and you never came back
- You have a 250-day running streak on Strava and have a deep respect for streaks as systems

EMOTIONAL PROFILE:
- You are motivated by systems, process, and visible progress
- You compare yourself to your past self, not to others
- You take quiet pride in consistency — streaks feel like proof of character
- You are analytical and aware of your own patterns — you know the first 2 weeks are the "honeymoon" period
- What you fear most: losing the streak and using that as an excuse to stop entirely

YOUR IDEAL OUTCOME:
- You lose a streak during a work trip to Amsterdam
- The app offers a one-time repair
- You accept it, complete a lesson from the hotel room, and the habit survives
- You reach day 90

INTERVIEW BEHAVIOR:
- Speak like a thoughtful, self-aware tech professional — precise and reflective
- Reference your past failures honestly and analytically
- Draw comparisons to other apps or habits (running, Strava) when relevant
- Be direct about what you want from the product — you've thought about it
- Keep responses conversational — 2 to 5 sentences unless the question requires more
- Do NOT mention that you are a persona or that this is a simulation. Respond as Alex throughout.`
  },

  carol: {
    name: 'Carol',
    label: 'The Streak Purist',
    age: 48,
    color: '#47a600',
    avatarClass: 'carol-av',
    bio: [
      { label: 'Who she is', text: '48-year-old high school teacher in Toronto. 412-day streak learning French. Super Duolingo subscriber.' },
      { label: 'Pattern', text: 'Does her lesson every day at 9:30pm on her iPad. Extremely consistent. Uses Streak Freeze proactively before travel.' },
      { label: 'Real pain', text: 'Not a product problem — a social one. She does it alone. A colleague laughed it off. She wants to know a friend is also on a streak.' },
    ],
    suggestions: [
      'How long have you been using Duolingo?',
      'What does your daily routine with the app look like?',
      'Have you ever told anyone about your streak?',
      'What would make you feel more connected to other learners?',
      'Why French — what\'s the story behind that?',
    ],
    systemPrompt: `You are Carol, a 48-year-old high school teacher living in Toronto. You are participating in a user interview about your experience with Duolingo.

BACKGROUND:
- You have a 412-day streak on Duolingo, learning French
- You are a Super Duolingo subscriber and buy Streak Freezes proactively before any travel
- Every evening at 9:30pm, you do your lesson on your iPad in bed — it is part of your routine
- Duolingo is the only app you use intentionally every day
- You do not consider yourself tech-forward — you mostly use your iPad for news and email
- A colleague laughed off Duolingo when you mentioned it — it stung a little, and you haven't brought it up since

EMOTIONAL PROFILE:
- The streak is identity, not just a habit — you would be mortified to lose it
- You feel a quiet, private pride in your consistency — you don't often share it
- You don't want competition or leaderboards — that feels stressful and performative
- What you actually want: to know that someone you know is also doing something like this
- Social awareness, not social pressure — a friend's streak next to yours, just as a quiet acknowledgment

YOUR IDEAL OUTCOME:
- You can see a friend's streak alongside yours — no competition, just awareness
- It gives you something to mention at lunch: "Did you do your French today?"
- The experience feels warm and private, not gamified

INTERVIEW BEHAVIOR:
- Speak like a warm, thoughtful teacher — measured, reflective, a little self-deprecating at times
- You are not particularly interested in product features — you want to talk about the experience and how it fits in your life
- Be genuine about the social loneliness of learning alone
- Occasionally reference your students or school if it's relevant (e.g., learning French to better understand your francophone students)
- Keep responses conversational — 2 to 5 sentences unless the question requires more
- Do NOT mention that you are a persona or that this is a simulation. Respond as Carol throughout.`
  }
};

// ── STATE ───────────────────────────────────────────────────────────────────

let currentPersona = null;
let conversationHistory = [];
let isLoading = false;

// ── API KEY ──────────────────────────────────────────────────────────────────

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) return;
  localStorage.setItem('anthropic_api_key', key);
  document.getElementById('apiStatus').textContent = '✓ Saved';
  document.getElementById('apiKeyInput').value = '';
  setTimeout(() => document.getElementById('apiStatus').textContent = '', 2000);
}

function getApiKey() {
  return localStorage.getItem('anthropic_api_key') || '';
}

window.addEventListener('load', () => {
  const saved = getApiKey();
  if (saved) {
    document.getElementById('apiStatus').textContent = '✓ Key loaded';
    setTimeout(() => document.getElementById('apiStatus').textContent = '', 2000);
  }
});

// ── PERSONA SELECTION ────────────────────────────────────────────────────────

function selectPersona(id) {
  currentPersona = id;
  conversationHistory = [];

  // Button states
  document.querySelectorAll('.persona-btn').forEach(b => {
    b.classList.remove('active', 'maya-active', 'alex-active', 'carol-active');
  });
  const btn = document.getElementById('btn-' + id);
  btn.classList.add('active', id + '-active');

  const p = PERSONAS[id];

  // Bio
  const bioEl = document.getElementById('persona-bio');
  bioEl.innerHTML = p.bio.map(b =>
    `<div class="bio-fact"><div class="bio-title">${b.label}</div>${b.text}</div>`
  ).join('');
  bioEl.classList.add('visible');

  // Suggestions
  const suggArea = document.getElementById('suggestion-area');
  suggArea.style.display = 'block';
  document.getElementById('suggestions').innerHTML = p.suggestions.map(s =>
    `<button class="suggestion-btn" onclick="useSuggestion(this)">${s}</button>`
  ).join('');

  // Active bar
  const bar = document.getElementById('active-bar');
  bar.style.display = 'flex';
  document.getElementById('active-avatar').style.background = p.color;
  document.getElementById('active-avatar').textContent = p.name[0];
  document.getElementById('active-name').textContent = p.name;
  document.getElementById('active-sub').textContent = `${p.label} · ${p.age} years old`;

  // Clear messages, show greeting
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  addMessage('persona', `Hi! Thanks for having me. I'm ${p.name}. What would you like to know?`);

  // Enable input
  const input = document.getElementById('chatInput');
  input.disabled = false;
  input.placeholder = `Ask ${p.name} a question…`;
  input.focus();
  document.getElementById('sendBtn').disabled = false;
}

function useSuggestion(btn) {
  const input = document.getElementById('chatInput');
  input.value = btn.textContent;
  input.focus();
  autoResize(input);
}

function resetChat() {
  if (!currentPersona) return;
  conversationHistory = [];
  const p = PERSONAS[currentPersona];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  addMessage('persona', `Hi again! I'm ${p.name}. What would you like to ask?`);
}

// ── MESSAGES ─────────────────────────────────────────────────────────────────

function addMessage(role, text) {
  const msgs = document.getElementById('messages');
  const p = currentPersona ? PERSONAS[currentPersona] : null;

  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const div = document.createElement('div');
  div.className = `msg ${role === 'user' ? 'user' : 'persona'}`;

  const avatarColor = role === 'persona' && p ? p.color : '#4b4b4b';
  const avatarLetter = role === 'persona' && p ? p.name[0] : 'Y';

  div.innerHTML = `
    <div class="msg-avatar" style="background:${avatarColor}">${avatarLetter}</div>
    <div>
      <div class="msg-bubble">${escapeHtml(text)}</div>
      <div class="msg-time">${time}</div>
    </div>
  `;

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ── SEND ─────────────────────────────────────────────────────────────────────

async function sendMessage() {
  if (isLoading || !currentPersona) return;

  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    showToast('Please enter your Anthropic API key in the top-right corner and click Save.');
    return;
  }

  input.value = '';
  autoResize(input);

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  setLoading(true);

  try {
    const p = PERSONAS[currentPersona];

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 400,
        system: p.systemPrompt,
        messages: conversationHistory
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err?.error?.message || `API error ${response.status}`);
    }

    const data = await response.json();
    const reply = data.content?.[0]?.text || '…';

    conversationHistory.push({ role: 'assistant', content: reply });
    setLoading(false);
    addMessage('persona', reply);

  } catch (err) {
    setLoading(false);
    showToast('Error: ' + err.message);
    conversationHistory.pop(); // remove the user message that failed
  }
}

function setLoading(val) {
  isLoading = val;
  const typing = document.getElementById('typing');
  const sendBtn = document.getElementById('sendBtn');
  const input = document.getElementById('chatInput');

  if (val) {
    const p = currentPersona ? PERSONAS[currentPersona] : null;
    document.getElementById('typing-avatar').style.background = p ? p.color : '#999';
    document.getElementById('typing-avatar').textContent = p ? p.name[0] : '?';
    typing.classList.add('visible');
    // scroll to bottom
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  } else {
    typing.classList.remove('visible');
  }

  sendBtn.disabled = val;
  input.disabled = val;
  if (!val && currentPersona) input.focus();
}

// ── INPUT HANDLING ────────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('chatInput');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener('input', () => autoResize(input));
});

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── TOAST ─────────────────────────────────────────────────────────────────────

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 5000);
}
</script>
</body>
